name: Frontend Auto Deploy to S3

on:
  push:
    branches:
      - dev
      - feat/deploy/#32

jobs:
  Deploy_Frontend_to_S3:
    runs-on: ubuntu-latest

    steps:
      - name: EC2 서버에 SSH 원격 접속 후 프론트엔드 배포 작업 수행
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            # 작업 디렉토리로 이동
            cd /home/ubuntu/local-community-web/frontend

            # dev 브랜치의 최신 코드 가져오기
            git fetch origin
            git checkout dev
            git pull origin dev

            # feat/deploy/#32 브랜치의 변경 사항 병합
            git fetch origin feat/deploy/#32
            git cherry-pick origin/feat/deploy/#32

            # 충돌이 발생하면 자동 병합 및 지속
            if [ $? -ne 0 ]; then
              echo "Conflict detected during cherry-pick. Resolving conflicts..."
              git cherry-pick --continue
            fi

            # 의존성 설치
            npm install

            # 프로젝트 빌드
            npm run build

            # S3로 빌드 결과물 동기화
            aws s3 sync build/ s3://town-in-web-page --region ap-northeast-2 --delete

            # 배포 확인 메시지 출력
            echo "Frontend has been deployed with changes from feat/deploy/#32 branch."
